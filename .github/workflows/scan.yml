# Scan the checked-in tree for secrets and workflow policy issues.
name: scan.yml

# Run security checks on main and on pull requests so the same check can protect
# the default branch.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Security scans only need repository read access.
permissions:
  contents: read

# Cancel older scan runs for the same branch or PR when a newer commit appears.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-repo
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 preserves full history so gitleaks can scan commits, not
      # just files in the current checkout.
      - name: Check out repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect workflow changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu

          base_sha="${BASE_SHA:-${BEFORE_SHA:-}}"
          if [ -z "${base_sha}" ] || printf '%s' "${base_sha}" | grep -Eq '^0+$'; then
            printf 'workflow_checks=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            printf 'workflow_checks=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files=$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")
          if printf '%s\n' "${changed_files}" | grep -Eq '^\.github/workflows/.*\.yml$'; then
            printf 'workflow_checks=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'workflow_checks=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Run secret and workflow scans
        env:
          SCAN_WORKFLOW_CHECKS: ${{ steps.changes.outputs.workflow_checks }}
        run: PROJECT_CFG_FILE=config/project.cfg make scan
